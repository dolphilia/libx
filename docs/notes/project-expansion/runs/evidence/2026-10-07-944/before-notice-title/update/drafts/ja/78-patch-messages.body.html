<h3 class="section" id="Messages-and-Questions-from-patch"><span>10.11 <code class="command">patch</code>のメッセージと質問</span></h3>
<a class="index-entry-id" id="index-patch-messages-and-questions"></a>
<a class="index-entry-id" id="index-diagnostics-from-patch"></a>
<a class="index-entry-id" id="index-messages-from-patch"></a>
<p><code class="command">patch</code>は特に入力の解読に問題がある場合、さまざまなメッセージを出します。進め方が判断できない状況では、通常<code class="command">patch</code>はキーボードから追加情報を求めます。メッセージ量を増減する、キーボード入力を求めない、メッセージ内のファイル名の引用形式を変える、といったオプションがあります。</p>
<p><code class="command">patch</code>の終了ステータスは、全ハンクの適用成功なら0、一部を適用できなければ1、より重大な問題なら2です。ループで一連のパッチを適用する場合は、部分的に適用済みのファイルへ次のパッチを適用しないよう、終了ステータスを確認すべきです。</p>
