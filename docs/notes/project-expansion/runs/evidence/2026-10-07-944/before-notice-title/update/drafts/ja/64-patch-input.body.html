<h3 class="section" id="Selecting-the-patch-Input-Format"><span>10.1 <code class="command">patch</code>の入力形式の選択</span></h3>
<a class="index-entry-id" id="index-patch-input-format"></a>
<p><code class="command">patch</code>は通常、内容を調べてパッチファイルの<code class="command">diff</code>形式を判定します。先頭に紛らわしいテキストを含むパッチファイルでは、次のいずれかのオプションで、特定の差分形式として解釈するよう<code class="command">patch</code>に指定する必要があるかもしれません。ここに挙げる出力形式だけが<code class="command">patch</code>で認識できます。</p>
<dl class="table">
<dt><samp class="option">-c</samp></dt>
<dt><samp class="option">--context</samp></dt>
<dd><p>コンテキスト diff。</p>
</dd>
<dt><samp class="option">-e</samp></dt>
<dt><samp class="option">--ed</samp></dt>
<dd><p><code class="command">ed</code>スクリプト。</p>
</dd>
<dt><samp class="option">-n</samp></dt>
<dt><samp class="option">--normal</samp></dt>
<dd><p>通常形式の diff。</p>
</dd>
<dt><samp class="option">-u</samp></dt>
<dt><samp class="option">--unified</samp></dt>
<dd><p>統一形式の diff。</p></dd>
</dl>
<hr/>
</div>
