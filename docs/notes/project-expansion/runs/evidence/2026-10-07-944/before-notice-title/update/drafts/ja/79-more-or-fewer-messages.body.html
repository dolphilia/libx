<div class="gnu-diffutils-original-content" id="More-or-Fewer-Messages">
<h4 class="subsection" id="Controlling-the-Verbosity-of-patch"><span>10.11.1 <code class="command">patch</code>のメッセージ量の制御</span></h4>
<a class="index-entry-id" id="index-verbose-messages-from-patch"></a>
<a class="index-entry-id" id="index-inhibit-messages-from-patch"></a>
<p><samp class="option">--verbose</samp>オプションを使えば、<code class="command">patch</code>のメッセージを増やせます。たとえば ‘<samp class="samp">Hmm...</samp>’ というメッセージは、<code class="command">patch</code>がパッチファイルのテキストを読み、パッチが含まれるか、含まれるならどの形式かを判定しようとしていることを示します。</p>
<p><samp class="option">-s</samp>、<samp class="option">--quiet</samp>、<samp class="option">--silent</samp>のいずれかを使えば、エラー時を除いて<code class="command">patch</code>の端末出力をすべて抑制できます。</p>
<hr/>
</div>
