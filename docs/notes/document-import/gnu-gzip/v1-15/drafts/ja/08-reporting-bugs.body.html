<h2 class="chapter" id="Reporting-Bugs"><span>7 バグの報告</span></h2>
<a class="index-entry-id" id="index-bugs"></a>
<p><code class="command">gzip</code>のバグを見つけた場合は、<a class="email" href="mailto:bug-gzip@gnu.org">bug-gzip@gnu.org</a>へメールで報告してください。「<samp class="samp">gzip -V</samp>」<!-- /@w -->を実行して確認できるバージョン番号を含めてください。また、ハードウェアとOS、<code class="command">gzip</code>のコンパイルに使ったコンパイラー、バグの動作の説明、そのバグを引き起こした<code class="command">gzip</code>への入力も、メッセージに含めてください。</p>
