<h2 class="chapter" id="Using-gzip-on-tapes"><span>6 テープで<code class="command">gzip</code>を使う</span></h2>
<a class="index-entry-id" id="index-tapes"></a>
<p>圧縮データをテープに書き込むときは、一般に、ブロック境界まで出力をゼロで埋める必要があります。データを読み、ブロック全体を<code class="command">gunzip</code>に渡して展開すると、<code class="command">gunzip</code>は圧縮データの後ろに余分なデータがあることを検出します。その余分なデータにゼロ以外のバイトが含まれる場合は、既定で警告を出します。警告を抑制するには、オプション<samp class="option">--quiet</samp>を使えます。</p>
