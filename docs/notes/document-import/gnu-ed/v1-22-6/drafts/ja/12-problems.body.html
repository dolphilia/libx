<h2 class="chapter" id="Reporting-bugs"><span>11 バグの報告<a class="copiable-link" href="#Reporting-bugs"> ¶</a></span></h2>
<p><code class="command">ed</code> にはおそらくバグがあります。このマニュアルには確実に誤りや記載漏れがあります。報告してもらえれば修正されます。報告がなければ、誰にも知られず、永遠に、あるいはそれ以上に、修正されないままでしょう。</p>
<p><code class="command">ed</code> のバグを見つけたら、<a class="email" href="mailto:bug-ed@gnu.org">bug-ed@gnu.org</a> 宛てに電子メールを送ってください。「<samp class="samp">ed --version</samp>」<!-- /@w --> を実行して確認できるバージョン番号を含めてください。</p>
<hr/>
