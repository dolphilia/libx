<h3 class="section" id="Links-1"><span>2.4 Links</span></h3>
<p>There are two ways that files can be linked together.  <em class="dfn">Symbolic
links</em> are a special type of file whose contents are a portion of the
name of another file.  <em class="dfn">Hard links</em> are multiple directory entries
for one file; the file names all have the same index node
(<em class="dfn">inode</em>) number on the disk.
</p>
