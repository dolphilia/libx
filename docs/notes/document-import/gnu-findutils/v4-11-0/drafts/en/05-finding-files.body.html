<h2 class="chapter" id="Finding-Files-1"><span>2 Finding Files</span></h2>
<p>By default, <code class="code">find</code> prints to the standard output the names of the
files that match the given criteria.  See <a class="xref" href="/docs/gnu-findutils/source/v4-11-0/manual.html#Actions">Actions</a>, for how to get
more information about the matching files.
</p>
