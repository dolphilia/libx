<h3 class="section" id="Links-1"><span>2.4 リンク</span></h3>
<p>ファイルを結び付ける方法には2種類あります。<em class="dfn">シンボリックリンク</em>は、内容が別のファイル名の一部である特別な種類のファイルです。<em class="dfn">ハードリンク</em>は、1つのファイルに対する複数のディレクトリエントリです。それらのファイル名は、ディスク上で同じ索引ノード（<em class="dfn">inode</em>）番号を持ちます。</p>
