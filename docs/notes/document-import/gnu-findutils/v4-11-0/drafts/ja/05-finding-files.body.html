<h2 class="chapter" id="Finding-Files-1"><span>2 ファイルを検索する</span></h2>
<p>既定では、<code class="code">find</code>は指定した条件に一致するファイルの名前を標準出力へ表示します。一致するファイルについてさらに詳しい情報を得る方法は、<a class="xref" href="/docs/gnu-findutils/source/v4-11-0/manual.html#Actions">アクション</a>を参照してください。</p>
