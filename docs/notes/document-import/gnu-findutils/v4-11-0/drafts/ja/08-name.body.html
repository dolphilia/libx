<h3 class="section" id="Name-1"><span>2.3 名前</span></h3>
<p>ファイル名が特定のパターンに一致するファイルを検索する方法を示します。これらのテストの<var class="var">pattern</var>引数については、<a class="xref" href="/docs/gnu-findutils/v4-11-0/ja/01-guide/12-shell-pattern-matching/#Shell-Pattern-Matching">シェルのパターンマッチング</a>を参照してください。</p>
<p>各テストには、大文字と小文字を区別する版と、区別しない版があります。区別しない版の名前は「<samp class="samp">i</samp>」で始まります。大文字と小文字を区別しない比較では、パターン「<samp class="samp">fo*</samp>」と「<samp class="samp">F??</samp>」は、<samp class="file">Foo</samp>、「<samp class="samp">FOO</samp>」、「<samp class="samp">foo</samp>」、「<samp class="samp">fOo</samp>」などのファイル名に一致します。</p>
