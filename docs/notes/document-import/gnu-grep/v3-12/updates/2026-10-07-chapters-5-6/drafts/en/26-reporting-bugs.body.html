<h2 class="chapter" id="Reporting-bugs"><span>6 Reporting bugs</span></h2>
<a class="index-entry-id" id="index-bugs_002c-reporting"></a>
<p>Bug reports can be found at the
<a class="url" href="https://debbugs.gnu.org/cgi/pkgreport.cgi?package=grep">GNU bug report logs for <code class="command">grep</code></a>.
If you find a bug not listed there, please email it to
<a class="email" href="mailto:bug-grep@gnu.org">bug-grep@gnu.org</a> to create a new bug report.
</p>
