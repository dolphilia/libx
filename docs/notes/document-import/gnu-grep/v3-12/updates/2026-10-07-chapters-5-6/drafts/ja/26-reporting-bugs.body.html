<h2 class="chapter" id="Reporting-bugs"><span>6 不具合の報告</span></h2>
<a class="index-entry-id" id="index-bugs_002c-reporting"></a>
<p>不具合の報告は、<a class="url" href="https://debbugs.gnu.org/cgi/pkgreport.cgi?package=grep"><code class="command">grep</code>のGNU不具合報告ログ</a>で確認できます。そこに載っていない不具合を見つけた場合は、新しい不具合報告を作成するために<a class="email" href="mailto:bug-grep@gnu.org">bug-grep@gnu.org</a>へメールで報告してください。</p>
<hr/>
