<div class="gnu-grep-original-content" id="Generic-Program-Information">
<h4 class="subsection" id="Generic-Program-Information-1"><span>2.1.1 Generic Program Information</span></h4>
<dl class="table">
<dt><a class="index-entry-id" id="index-usage-summary_002c-printing"></a>
<a id="index-_002d_002dhelp"></a><span><samp class="option">--help</samp></span></dt>
<dd><p>Print a usage message briefly summarizing the command-line options
and the bug-reporting address, then exit.
</p>
</dd>
<dt><a class="index-entry-id" id="index-_002d_002dversion"></a>
<a class="index-entry-id" id="index-version_002c-printing"></a>
<a id="index-_002dV"></a><span><samp class="option">-V</samp></span></dt>
<dt><samp class="option">--version</samp></dt>
<dd><p>Print the version number of <code class="command">grep</code> to the standard output stream.
This version number should be included in all bug reports.
</p>
</dd>
</dl>
<hr/>
</div>
