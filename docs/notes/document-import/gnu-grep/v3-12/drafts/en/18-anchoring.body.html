<h3 class="section" id="Anchoring-1"><span>3.4 Anchoring</span></h3>
<a class="index-entry-id" id="index-anchoring"></a>
<p>The caret ‘<samp class="samp">^</samp>’ and the dollar sign ‘<samp class="samp">$</samp>’ are special characters that
respectively match the empty string at the beginning and end of a line.
They are termed <em class="dfn">anchors</em>, since they force the match to be “anchored”
to beginning or end of a line, respectively.
</p>
