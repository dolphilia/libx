<h4 class="unnumberedsubsec" id="Getting-Help_003a-Using-the-_002d_002dhelp-Option"><span>Getting Help: Using the <samp class="option">--help</samp> Option</span></h4>
<dl class="table">
<dt><a id="index-help"></a><span><samp class="option">--help</samp></span></dt>
<dd>
<p>The <samp class="option">--help</samp> option to <code class="command">tar</code> prints out a very brief list of
all operations and option available for the current version of
<code class="command">tar</code> available on your system.
</p></dd>
</dl>
