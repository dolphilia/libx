<h3 class="section" id="Zero-Address-1"><span>4.5 アドレス0</span></h3>
<a class="index-entry-id" id="index-Zero-Address"></a>
<p>GNU <code class="command">sed</code> の拡張として、アドレス <code class="code">0</code> は次の場合に使えます。</p><ol class="enumerate">
<li><code class="code">0,/<var class="var">regexp</var>/</code> のような正規表現による範囲アドレスで使う場合（<a class="pxref" href="#Zero-Address-Regex-Range">アドレス0の正規表現範囲</a>を参照）。</li><li><code class="code">r</code> コマンドで、最初の行の前にファイルを挿入する場合（<a class="pxref" href="#Adding-a-header-to-multiple-files">複数ファイルへのヘッダーの追加</a>を参照）。</li><li><var class="var">first</var>~<var class="var">step</var> 拡張の開始アドレスとして使う場合（<a class="pxref" href="#Numeric-Addresses">行番号による行の選択</a>を参照）。</li></ol>
<p>アドレス <code class="code">0</code> が意味を持つのは、これらの場合だけであることに注意してください。これ以外の方法でアドレス <code class="code">0</code> を指定したコマンドは、エラーになります。</p>
<hr/>
</div>
