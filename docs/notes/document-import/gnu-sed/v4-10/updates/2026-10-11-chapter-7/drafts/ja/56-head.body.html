<h3 class="section" id="Printing-the-First-Lines"><span>7.16 最初の数行の出力</span></h3>
<p>これは、おそらく実用的な<code class="command">sed</code>スクリプトの中で最も単純なものです。入力の先頭10行を表示します。表示する行数は、<code class="code">q</code>コマンドの直前にあります。</p>
<div class="example">
<div class="group"><pre class="example-preformatted">#!/usr/bin/sed -f
10q
</pre></div></div>
<hr/>
</div>
