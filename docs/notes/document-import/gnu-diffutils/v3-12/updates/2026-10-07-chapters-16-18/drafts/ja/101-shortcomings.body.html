<h3 class="section" id="Suggested-Projects-for-Improving-GNU-diff-and-patch"><span>18.1 GNU <code class="command">diff</code> と <code class="command">patch</code> を改善するための推奨プロジェクト</span></h3>
<a class="index-entry-id" id="index-projects-for-directories"></a>
<p>GNU <code class="command">diff</code> を使って任意の2つのディレクトリツリーからパッチを生成し、そのパッチと一方のツリーのコピーを使って <code class="command">patch</code> で他方の正確なコピーを生成できるべきです。残念ながら、現在のパッチ形式ではディレクトリツリーの一部の変化を表せず、<code class="command">patch</code> も既存の一部の形式を扱えません。これらの不足を踏まえ、以下のプロジェクトを提案します。</p>
