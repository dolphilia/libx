<h4 class="subsection" id="Outputting-Diffs-in-Timestamp-Order"><span>18.1.5 タイムスタンプ順での差分出力</span></h4>
<p>複数ファイルの差分に <code class="command">patch</code> を適用すると、ファイルのタイムスタンプの順序が乱れることがあります。GNU <code class="command">patch</code> には更新したファイルのタイムスタンプを復元するオプションがあります（<a class="pxref" href="#Patching-Timestamps">パッチ適用済みファイルのタイムスタンプの更新</a>を参照してください）が、受信者が GNU patch を持っていない場合や、これらのオプションを使わない場合にも動作するパッチを生成できると役立つことがあります。その方法の1つは、差分をタイムスタンプ順で出力する <code class="command">diff</code> のオプションを実装することです。</p>
