<div class="gnu-diffutils-original-content" id="Unusual-File-Names">
<h4 class="subsection" id="File-Names-that-Contain-Unusual-Characters"><span>18.1.4 特殊な文字を含むファイル名</span></h4>
<a class="index-entry-id" id="index-file-names-with-unusual-characters"></a>
<p>diffutils-3.3 以降、改行や TAB のような特殊な文字による曖昧さをなくすため、ファイル名を符号化しています。ただし、改行を含むファイル名は、diff や patch に限らず多くの場面で容易に問題を起こし得るため、将来の diff はそうした名前を操作しようとすることを拒否する可能性があります。</p>
<hr/>
</div>
