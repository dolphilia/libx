<h4 class="subsection" id="Improving-Performance"><span>18.1.7 性能の改善</span></h4>
<p>一方が他方からタイムスタンプを保持してコピーされた（たとえば「<samp class="samp">cp -pR</samp>」で）大きな2つのディレクトリ構造を比較するとき、サイズとタイムスタンプが同じ2つのファイルは内容も同じと仮定するよう <code class="command">diff</code> に指示するオプションがあれば、性能を大幅に改善できます。<a class="xref" href="#diff-Performance"><code class="command">diff</code> の性能上のトレードオフ</a>を参照してください。</p>
