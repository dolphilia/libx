<h2 class="chapter" id="Interactive-Merging-with-sdiff"><span>9 <code class="command">sdiff</code> による対話的なマージ</span></h2>
<a class="index-entry-id" id="index-diff-merging"></a>
<a class="index-entry-id" id="index-interactive-merging"></a>
<p><code class="command">sdiff</code> を使うと、左右に並べた <samp class="option">-y</samp> 形式の比較に基づいて2つのファイルを対話的にマージできます（<a class="pxref" href="#Side-by-Side">差分を左右に並べて表示する</a> を参照）。<samp class="option">--output=<var class="var">file</var></samp>（<samp class="option">-o <var class="var">file</var></samp>）でマージしたテキストの出力先を指定します。<code class="command">sdiff</code> のオプションについて詳しくは、<a class="xref" href="#Invoking-sdiff"><code class="command">sdiff</code> の起動</a> を参照してください。</p>
<p>対話的にファイルをマージする別の方法として、Emacs Lisp パッケージ <code class="command">emerge</code> を使う方法があります。詳しくは <cite class="cite">The GNU Emacs Manual</cite> の <a data-manual="emacs" href="https://www.gnu.org/software/emacs/manual/html_mono/emacs.html#Emerge">Emerge</a> を参照してください。</p>
<hr/>
