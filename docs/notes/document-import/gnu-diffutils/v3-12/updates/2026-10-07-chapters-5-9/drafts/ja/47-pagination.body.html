<div class="gnu-diffutils-original-content" id="Pagination">
<h3 class="section" id="Paginating-diff-Output"><span>5.3 <code class="command">diff</code> の出力をページに分ける</span></h3>
<a class="index-entry-id" id="index-paginating-diff-output"></a>
<p>長い出力にページ番号と日時を付けると便利な場合があります。<samp class="option">--paginate</samp>（<samp class="option">-l</samp>）オプションは、<code class="command">diff</code> の出力を <code class="command">pr</code> プログラムに渡してこれを行います。「<samp class="samp">diff -lc lao tzu</samp>」のページ見出しは、たとえば次のようになります。</p>
<div class="example">
<pre class="example-preformatted">2002-02-22 14:20                 diff -lc lao tzu                 Page 1
</pre></div>
<hr/>
</div>
