<h2 class="chapter" id="Comparing-Three-Files-1"><span>7 3つのファイルを比較する</span></h2>
<a class="index-entry-id" id="index-comparing-three-files"></a>
<a class="index-entry-id" id="index-format-of-diff3-output"></a>
<p><code class="command">diff3</code> プログラムは、3つのファイルを比較し、それらの間の差分を表示します。（<code class="command">diff3</code> はファイルのマージもできます。<a class="ref" href="#diff3-Merging">共通の祖先からのマージ</a> を参照。）</p>
<p><code class="command">diff3</code> の「normal」出力形式では、差分の hunk ごとに、その周囲の文脈を含めずに表示します。hunk には2方向か3方向かに応じたラベルが付き、行には入力ファイル内の位置が示されます。</p>
<p><code class="command">diff3</code> の実行方法について詳しくは、<a class="xref" href="#Invoking-diff3"><code class="command">diff3</code> の起動</a> を参照してください。</p>
<hr/>
</div>
