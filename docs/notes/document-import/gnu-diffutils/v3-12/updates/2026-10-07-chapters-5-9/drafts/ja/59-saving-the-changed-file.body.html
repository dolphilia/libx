<div class="gnu-diffutils-original-content" id="Saving-the-Changed-File">
<h3 class="section" id="Saving-the-Changed-File-1"><span>8.5 変更したファイルを保存する</span></h3>
<a class="index-entry-id" id="index-System-V-diff3-compatibility"></a>
<p>従来の Unix の <code class="command">diff3</code> は、変更を保存する末尾の「<samp class="samp">w</samp>」「<samp class="samp">q</samp>」コマンドを含めずに <code class="command">ed</code> スクリプトを生成します。System V の <code class="command">diff3</code> はこれらの追加コマンドを生成します。GNU <code class="command">diff3</code> は通常、従来の Unix の <code class="command">diff3</code> と同様に動作しますが、<samp class="option">-i</samp> オプションを指定すると System V の <code class="command">diff3</code> と同様に「<samp class="samp">w</samp>」「<samp class="samp">q</samp>」コマンドを追加します。</p>
<p><samp class="option">-i</samp> オプションには、<code class="command">ed</code> スクリプトのオプション <samp class="option">-AeExX3</samp> のいずれかが必要で、マージ済み出力のオプション <samp class="option">-m</samp> とは併用できません。</p>
<hr/>
</div>
