<div class="gnu-diffutils-original-content" id="Merging-Incomplete-Lines">
<h3 class="section" id="How-diff3-Merges-Incomplete-Lines"><span>8.4 <code class="command">diff3</code> による不完全な行のマージ</span></h3>
<a class="index-entry-id" id="index-incomplete-line-merging"></a>
<p><samp class="option">-m</samp> を指定すると、不完全な行（<a class="pxref" href="#Incomplete-Lines">不完全な行</a> を参照）は、見つかったままの形で出力へコピーされます。マージ済み出力の末尾が競合になり、入力ファイルの1つが不完全な行で終わる場合、後続の「<samp class="samp">|||||||</samp>」「<samp class="samp">=======</samp>」「<samp class="samp">&gt;&gt;&gt;&gt;&gt;&gt;&gt;</samp>」の囲みは不完全な行に付加されるため、行頭以外の場所に現れます。</p>
<p><samp class="option">-m</samp> を指定せずに <code class="command">ed</code> スクリプトのオプションを指定し、不完全な行が見つかると、<code class="command">diff3</code> は警告を出し、改行があったものとして動作します。</p>
<hr/>
</div>
