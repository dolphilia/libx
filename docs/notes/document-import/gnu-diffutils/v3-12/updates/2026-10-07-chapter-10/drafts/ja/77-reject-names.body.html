<h3 class="section" id="Reject-File-Names"><span>10.10 拒否ファイル名</span></h3>
<a class="index-entry-id" id="index-reject-file-names"></a>
<p>拒否ファイル（<code class="command">patch</code>が適用位置を見つけられなかったパッチを含むファイル）の名前は通常、出力ファイル名に ‘<samp class="samp">.rej</samp>’ を付けたものです。‘<samp class="samp">.rej</samp>’ ではバックアップファイル名が長すぎる場合は ‘<samp class="samp">#</samp>’ を付けます。</p>
<p>また、拒否された全パッチを1つのファイルに保存するよう<code class="command">patch</code>に指定できます。<samp class="option">-r <var class="var">reject-file</var></samp>または<samp class="option">--reject-file=<var class="var">reject-file</var></samp>オプションでは、<var class="var">reject-file</var>を拒否ファイル名として使います。</p>
<hr/>
</div>
