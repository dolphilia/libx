<h4 class="subsection" id="Applying-Patches-with-Changed-White-Space"><span>10.3.1 空白が変更されたパッチの適用</span></h4>
<a class="index-entry-id" id="index-white-space-in-patches"></a>
<p>メールソフト、エディターなどがスペースをタブに変えたり、その逆を行ったりすることがあります。パッチファイルや入力ファイルでこれが起こると、見た目は同じでも<code class="command">patch</code>が正しく照合できなくなります。この場合は<samp class="option">-l</samp>または<samp class="option">--ignore-white-space</samp>オプションを使ってください。<code class="command">patch</code>が空白文字（スペースとタブ）を緩く比較し、パッチファイルの空でない空白列を、入力ファイルの任意の空でない空白列と一致させます。空白以外の文字は依然として完全一致が必要です。コンテキストの各行も入力ファイルの行と一致する必要があります。</p>
<hr/>
