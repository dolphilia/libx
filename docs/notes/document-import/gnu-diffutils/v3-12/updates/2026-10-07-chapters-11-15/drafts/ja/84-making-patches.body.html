<h2 class="chapter" id="Tips-for-Making-and-Using-Patches"><span>11 パッチの作成と利用のヒント</span></h2>
<p>パッチを作成・利用するときは、常識的に判断してください。たとえば、プログラムの保守担当者へバグ修正を送る場合は、すべての内容をまとめた大きくて理解しにくいパッチを1つ送るより、独立した内容ごとに小さなパッチを分けて送ります。</p>
<p>ソフトウェアパッケージを更新するためにパッチを配布する場合には、次の点にも注意してください。</p>
