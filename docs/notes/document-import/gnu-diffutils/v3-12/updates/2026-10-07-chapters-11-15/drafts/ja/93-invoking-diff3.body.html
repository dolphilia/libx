<div class="gnu-diffutils-original-content" id="Invoking-diff3">
<h2 class="chapter" id="Invoking-diff3-1"><span>14 <code class="command">diff3</code> の起動</span></h2>
<a class="index-entry-id" id="index-invoking-diff3"></a>
<a class="index-entry-id" id="index-diff3-invocation"></a>
<p><code class="command">diff3</code> コマンドは3つのファイルを比較し、相違の説明を出力します。引数は次のとおりです。</p>
<div class="example">
<pre class="example-preformatted">diff3 <var class="var">options</var>... <var class="var">mine</var> <var class="var">older</var> <var class="var">yours</var>
</pre></div>
<p>比較するファイルは <var class="var">mine</var>、<var class="var">older</var>、<var class="var">yours</var> です。この3つのファイル名のうち最大1つを <samp class="file">-</samp> にできます。そのファイルについて、<code class="command">diff3</code> は標準入力を読みます。</p>
<p>終了ステータス0は <code class="command">diff3</code> の成功、1は競合が見つかったこと、2は問題が起きたことを表します。</p>
<hr/>
</div>
