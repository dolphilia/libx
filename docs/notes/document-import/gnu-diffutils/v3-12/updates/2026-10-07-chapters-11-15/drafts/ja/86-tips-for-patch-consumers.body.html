<h3 class="section" id="Tips-for-Patch-Consumers-1"><span>11.2 パッチ利用者へのヒント</span></h3>
<a class="index-entry-id" id="index-patch-consumer-tips"></a>
<p>パッチ作成者は受取人に適用方法を伝えるべきです。そのため、パッチ利用者の最初の心得は、パッチに添えられた説明に従うことです。</p>
<p>GNU <code class="command">diff</code> は任意の長さの行を含むファイルや、不完全な行で終わるファイルを解析できます。しかし、古いバージョンの <code class="command">patch</code> はそのようなファイルへパッチを適用できません。このようなパッチの適用に問題がある場合は、GNU <code class="command">patch</code> を最近のバージョンへ更新してみてください。</p>
