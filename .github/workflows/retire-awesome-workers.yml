name: Retire the nine Awesome preview Workers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-workers-awesome
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify recorded Workers and production Pages
        run: node .github/maintenance/retire-awesome-workers.mjs check
      - name: Preserve pre-deletion record
        uses: actions/upload-artifact@v4
        with:
          name: worker-retirement-before-${{ github.run_id }}
          path: .tmp/worker-retirement/check.json
          if-no-files-found: error
          retention-days: 90
      - name: Delete only the nine recorded preview Workers
        run: node .github/maintenance/retire-awesome-workers.mjs delete
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-retirement-${{ github.run_id }}
          path: .tmp/worker-retirement/
          if-no-files-found: warn
          retention-days: 90
